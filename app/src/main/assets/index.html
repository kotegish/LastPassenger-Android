<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Последний пассажир — Поезд «Нулевой»</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;touch-action:none}
#game{display:block;width:100%;height:100%}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
#move{left:18px}#actions{right:18px}
.control{width:68px;height:68px;border:1px solid #d6c18b99;border-radius:14px;background:#111a2acc;color:#f0dfb3;font:bold 24px monospace;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 12px #0008}
#jump{width:78px;height:78px;border-radius:50%;font-size:13px}
#interact{position:absolute;right:18px;bottom:112px;width:auto;min-width:150px;max-width:calc(100vw - 36px);height:48px;padding:0 14px;border-radius:12px;font-size:11px;letter-spacing:.3px;white-space:nowrap}
#interact[hidden]{display:none}
.control:active{background:#806c48dd;transform:scale(.96)}
#caption{position:fixed;left:12px;top:12px;padding:7px 10px;background:#101722b8;border:1px solid #a99a7755;color:#e2d5b5;font:10px monospace;letter-spacing:1px;pointer-events:none}
@media(min-width:900px){.control{opacity:.55}.control:hover{opacity:1}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="caption">ПОЕЗД «НУЛЕВОЙ» · МАШИННОЕ ОТДЕЛЕНИЕ</div>
<div id="controls">
 <div class="pad" id="move"><button class="control" id="left" aria-label="Влево">◀</button><button class="control" id="right" aria-label="Вправо">▶</button></div>
 <div class="pad" id="actions"><button class="control" id="jump">ПРЫЖОК</button></div>
 <button class="control" id="interact" hidden>ПЕРЕЙТИ</button>
</div>
<script src="js/train-platformer.js"></script>
</body>
</html>
