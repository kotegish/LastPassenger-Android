<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b12"><title>Последний пассажир</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#e8e4d8;font-family:Georgia,serif;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;background:#111925e8;border:1px solid #687383;border-radius:6px;padding:7px 11px;box-shadow:0 3px 18px #0009}
#brand{top:9px;left:10px;font-size:11px;letter-spacing:2px;color:#c5a66a}#stats{top:33px;left:10px;font:12px monospace}#hint{top:9px;right:10px;font:10px monospace;color:#aab5c3}
#bossbar{display:none;top:44px;left:50%;transform:translateX(-50%);width:min(280px,55vw);font:10px monospace;text-align:center;color:#e7b3a0}#bossfill{height:5px;background:#9f4c4c;margin-top:5px;width:100%}
#stick{position:absolute;left:20px;bottom:18px;width:122px;height:122px;border:2px solid #b3bdc766;border-radius:50%;background:#18233399;pointer-events:auto;touch-action:none}#nub{position:absolute;width:46px;height:46px;left:36px;top:36px;border-radius:50%;background:#b9a16a99;border:2px solid #e2c98a}
.actions{position:absolute;right:15px;bottom:17px;display:flex;gap:9px;align-items:end;pointer-events:auto}.act{position:relative;overflow:hidden;width:60px;height:60px;border-radius:50%;border:2px solid #b9a16a;background:#182333ed;color:#f2d99b;font:bold 10px monospace;touch-action:none}.act span{position:relative;z-index:2}.cooldown{position:absolute;z-index:1;left:0;right:0;bottom:0;height:100%;background:#050912b8;transform:scaleY(0);transform-origin:bottom;pointer-events:none}#skill{width:68px;height:68px}#dash{width:58px;height:58px}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#0b111df2;border:1px solid #9b8051;padding:18px 22px;width:min(420px,86vw);pointer-events:auto}#message h1{font-size:clamp(20px,4vw,34px);font-weight:normal;margin:0 0 8px;color:#e8c987}#message p{font:12px/1.6 monospace;color:#b8c1ca}#start{background:#8c6c3e;color:#fff;border:0;padding:11px 25px;font:13px monospace}.hidden{display:none}
</style></head><body>
<canvas id="game"></canvas><div id="hud">
<div id="brand" class="panel">SOLODEFSTUDIO · LAST PASSENGER</div><div id="stats" class="panel">ЗДОРОВЬЕ <span id="hp">100</span> · ПАМЯТЬ <span id="mem">0</span></div><div id="hint" class="panel">ГОРОД БЕЗ ЛЮДЕЙ · 01</div>
<div id="bossbar" class="panel">СТАНЦИОННЫЙ СМОТРИТЕЛЬ<div style="height:5px;background:#382b30;margin-top:5px"><div id="bossfill"></div></div></div>
<div id="stick"><div id="nub"></div></div><div class="actions"><button class="act" id="skill"><span>ИМПУЛЬС</span><i class="cooldown"></i></button><button class="act" id="dash">РЫВОК</button></div>
<div id="message"><h1>Последний пассажир</h1><p>Поезд «Нулевой» остановился у пустого вокзала.<br>Собирай осколки памяти. Сигнал уже заметил тебя.</p><button id="start">НАЧАТЬ ПУТЬ</button></div></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stick=document.getElementById('stick'),nub=document.getElementById('nub');
let W=0,H=0,started=false,hp=100,memory=0,last=0,spawn=0,attackCd=0,skillCd=0,dashCd=0,bossSpawned=false,boss=null,toast='',toastTime=0,wave=1,waveSpawned=0,waveQuota=5,waveBreak=0;
const world={w:1900,h:1300},player={x:950,y:650,faceX:1,faceY:0,inv:0},input={x:0,y:0};
let enemies=[],shards=[],particles=[],props=[],playerShots=[];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function say(s){toast=s;toastTime=2.2}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,t:.45+Math.random()*.25,c})}
function makeProps(){props=[];for(let i=0;i<34;i++){let x=70+Math.random()*(world.w-140),y=70+Math.random()*(world.h-140);if(Math.hypot(x-player.x,y-player.y)>180)props.push({x,y,type:i%4})}}
function spawnEnemy(forceType){let a=Math.random()*Math.PI*2,d=360+Math.random()*180,t=forceType||(['wanderer','archer','brute'][Math.floor(Math.random()*3)]);let spec={wanderer:[30,43,12,'#98645a'],archer:[22,30,10,'#788b91'],brute:[70,23,17,'#76535f']}[t];enemies.push({x:Math.max(25,Math.min(world.w-25,player.x+Math.cos(a)*d)),y:Math.max(25,Math.min(world.h-25,player.y+Math.sin(a)*d)),hp:spec[0],max:spec[0],speed:spec[1],r:spec[2],color:spec[3],type:t,hit:0,shot:1+Math.random()*2})}
function drop(e){shards.push({x:e.x,y:e.y,r:7});if(Math.random()<.18)shards.push({x:e.x+12,y:e.y+8,r:5,heal:true})}
function damageEnemy(e,n){e.hp-=n;e.hit=.16;burst(e.x,e.y,e.type==='boss'?'#d86b61':'#e6b66d',7);if(e.hp<=0){drop(e);if(e===boss){boss=null;document.getElementById('bossbar').style.display='none';say('Смотритель повержен. Путь к вокзалу открыт.')}else enemies.splice(enemies.indexOf(e),1)}}
function startGame(){started=true;hp=100;memory=0;wave=1;waveSpawned=0;waveQuota=5;waveBreak=0;attackCd=.1;bossSpawned=false;boss=null;enemies=[];shards=[];particles=[];playerShots=[];player.x=950;player.y=650;document.getElementById('hp').textContent='100';document.getElementById('mem').textContent='0';document.getElementById('message').classList.add('hidden');document.getElementById('bossbar').style.display='none';makeProps();for(let i=0;i<6;i++)spawnEnemy()}
document.getElementById('start').onclick=startGame;
function stickMove(e){let r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/47,dy=(e.clientY-r.top-r.height/2)/47,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}input.x=dx;input.y=dy;nub.style.transform='translate('+dx*34+'px,'+dy*34+'px)'}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e)});function stop(){input.x=input.y=0;nub.style.transform=''}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
function bind(id,fn){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();if(started)fn()})}

bind('skill',()=>{if(skillCd>0)return;skillCd=5;burst(player.x,player.y,'#ff8a4f',24);for(const e of enemies.concat(boss?[boss]:[]))if(Math.hypot(e.x-player.x,e.y-player.y)<170)damageEnemy(e,48);say('Огненный импульс')});
bind('dash',()=>{if(dashCd>0)return;dashCd=1.8;player.inv=.62;player.x=Math.max(20,Math.min(world.w-20,player.x+player.faceX*125));player.y=Math.max(20,Math.min(world.h-20,player.y+player.faceY*125));burst(player.x,player.y,'#9c9eff',14)});
function draw(){const vw=W/devicePixelRatio,vh=H/devicePixelRatio,cx=player.x-vw/2,cy=player.y-vh/2;ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#111923';ctx.fillRect(0,0,vw,vh);
let tile=64;for(let y=Math.floor(cy/tile)*tile;y<cy+vh+tile;y+=tile)for(let x=Math.floor(cx/tile)*tile;x<cx+vw+tile;x+=tile){ctx.fillStyle=((Math.floor(x/tile)+Math.floor(y/tile))%2===0)?'#19242c':'#151e27';ctx.fillRect(x-cx,y-cy,63,63);if(Math.sin(x*13+y*7)>.96){ctx.fillStyle='#46504e';ctx.fillRect(x-cx+20,y-cy+20,3,3)}}
ctx.strokeStyle='#47515a';ctx.lineWidth=5;ctx.strokeRect(-cx,-cy,world.w,world.h);
for(const p of props){let x=p.x-cx,y=p.y-cy;if(x<-45||y<-45||x>vw+45||y>vh+45)continue;ctx.fillStyle=p.type===0?'#333d43':p.type===1?'#493b34':p.type===2?'#283d43':'#574b38';ctx.fillRect(x-13,y-13,26,26);ctx.fillStyle='#758087';ctx.fillRect(x-10,y-11,20,3);ctx.fillStyle='#111820';ctx.fillRect(x-7,y-5,14,13)}
for(const s of shards){let x=s.x-cx,y=s.y-cy;ctx.fillStyle=s.heal?'#e26d75':'#70d5d0';ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x+7,y);ctx.lineTo(x,y+9);ctx.lineTo(x-7,y);ctx.fill()}
for(const e of enemies.concat(boss?[boss]:[])){let x=e.x-cx,y=e.y-cy;ctx.fillStyle=e.hit>0?'#fff0ce':e.color;ctx.fillRect(x-e.r,y-e.r,e.r*2,e.r*2);ctx.fillStyle='#f1c27c';ctx.fillRect(x-5,y-3,3,3);ctx.fillRect(x+3,y-3,3,3);ctx.fillStyle='#251c22';ctx.fillRect(x-e.r,y-e.r-7,e.r*2,3);ctx.fillStyle='#d76a63';ctx.fillRect(x-e.r,y-e.r-7,e.r*2*Math.max(0,e.hp/e.max),3)}
ctx.fillStyle=player.inv>0?'#c2d4ff':'#d9c59b';ctx.fillRect(player.x-cx-8,player.y-cy-12,16,24);ctx.fillStyle='#293b50';ctx.fillRect(player.x-cx-6,player.y-cy-4,12,12);ctx.fillStyle='#e5bf78';ctx.fillRect(player.x-cx+player.faceX*9-2,player.y-cy+player.faceY*9-2,4,4);
for(const p of particles){ctx.globalAlpha=Math.max(0,p.t*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-cx,p.y-cy,3,3)}ctx.globalAlpha=1;for(const b of playerShots){let x=b.x-cx,y=b.y-cy;ctx.save();ctx.shadowColor='#ffe5a0';ctx.shadowBlur=13;ctx.strokeStyle='#fff0b0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-b.vx*.025,y-b.vy*.025);ctx.lineTo(x,y);ctx.stroke();ctx.restore()}
if(boss&&boss.slam>0){ctx.strokeStyle='#e85f55';ctx.lineWidth=3;ctx.beginPath();ctx.arc(boss.x-cx,boss.y-cy,105*(1-boss.slam/.65),0,Math.PI*2);ctx.stroke()}if(toastTime>0){ctx.fillStyle='#f0d9a4';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText(toast,vw/2,vh*.22)}
}
function hurt(n){if(player.inv>0)return;hp=Math.max(0,hp-n);document.getElementById('hp').textContent=Math.ceil(hp);if(hp<=0){started=false;document.getElementById('message').classList.remove('hidden');document.querySelector('#message h1').textContent='СИГНАЛ ПОГЛОТИЛ ТЕБЯ';document.querySelector('#message p').textContent='Собрано осколков памяти: '+memory;document.getElementById('start').textContent='ПОПРОБОВАТЬ СНОВА'}}
function update(dt){if(!started)return;attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);dashCd=Math.max(0,dashCd-dt);document.querySelector('#skill .cooldown').style.transform='scaleY('+(skillCd/5)+')';document.querySelector('#skill span').textContent=skillCd>0?skillCd.toFixed(1)+'с':'ИМПУЛЬС';document.getElementById('skill').style.borderColor=skillCd>0?'#59616c':'#d6b56d';player.inv=Math.max(0,player.inv-dt);toastTime=Math.max(0,toastTime-dt);
let l=Math.hypot(input.x,input.y);if(l>.08){player.faceX=input.x/l;player.faceY=input.y/l}let target=enemies.concat(boss?[boss]:[]).filter(e=>Math.hypot(e.x-player.x,e.y-player.y)<420).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(target&&attackCd<=0){let dx=target.x-player.x,dy=target.y-player.y,d=Math.hypot(dx,dy)||1;player.faceX=dx/d;player.faceY=dy/d;playerShots.push({x:player.x+dx/d*13,y:player.y+dy/d*13,vx:dx/d*510,vy:dy/d*510,t:1.05,damage:24});burst(player.x+dx/d*13,player.y+dy/d*13,'#f3d28b',3);attackCd=.58}player.x=Math.max(20,Math.min(world.w-20,player.x+input.x*190*dt));player.y=Math.max(20,Math.min(world.h-20,player.y+input.y*190*dt));
for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(e.type==='archer'&&d<210){e.x-=dx/d*e.speed*.5*dt;e.y-=dy/d*e.speed*.5*dt;e.shot-=dt;if(e.shot<=0){e.shot=2.2;if(d<290){let vx=dx/d,vy=dy/d;particles.push({x:e.x,y:e.y,vx:vx*190,vy:vy*190,t:1.2,c:'#e3a76a',bolt:true})}}}else{e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}e.hit=Math.max(0,e.hit-dt);if(d<e.r+9&&player.inv<=0)hurt((e.type==='brute'?25:18)*dt)}
if(boss){let dx=player.x-boss.x,dy=player.y-boss.y,d=Math.hypot(dx,dy)||1;boss.x+=dx/d*boss.speed*dt;boss.y+=dy/d*boss.speed*dt;boss.hit=Math.max(0,boss.hit-dt);boss.windup=(boss.windup||0)-dt;if(boss.windup<=0){boss.windup= boss.phase===3?2.0:2.8;boss.slam=0.65}if(boss.slam>0){boss.slam-=dt;if(boss.slam<=0){burst(boss.x,boss.y,'#e66c61',22);if(d<boss.r+105&&player.inv<=0)hurt(22);say('Удар Смотрителя! Уходи из красной зоны')}}boss.phase=boss.hp<boss.max*.33?3:boss.hp<boss.max*.66?2:1;boss.speed=boss.phase===1?34:boss.phase===2?48:62;document.getElementById('bossfill').style.width=(100*Math.max(0,boss.hp/boss.max))+'%'}
for(let i=shards.length-1;i>=0;i--){let s=shards[i];if(Math.hypot(s.x-player.x,s.y-player.y)<30){if(s.heal){hp=Math.min(100,hp+22);document.getElementById('hp').textContent=Math.ceil(hp);say('Найден лечебный эликсир')}else{memory++;document.getElementById('mem').textContent=memory;say('Осколок памяти +1')}shards.splice(i,1)}}
for(let i=playerShots.length-1;i>=0;i--){let b=playerShots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;let target=enemies.concat(boss?[boss]:[]).find(e=>Math.hypot(e.x-b.x,e.y-b.y)<e.r+7);if(target){damageEnemy(target,b.damage);b.t=0}if(b.t<=0||b.x<0||b.y<0||b.x>world.w||b.y>world.h)playerShots.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.bolt&&Math.hypot(p.x-player.x,p.y-player.y)<15&&player.inv<=0){hurt(9);p.t=0;burst(p.x,p.y,'#e3a76a',4)}if(p.t<=0)particles.splice(i,1)}
spawn+=dt;if(!boss&&!bossSpawned&&waveSpawned<waveQuota&&spawn>1.15){spawn=0;spawnEnemy();waveSpawned++}if(!boss&&!bossSpawned&&waveSpawned>=waveQuota&&enemies.length===0){waveBreak+=dt;if(waveBreak>2.3){wave++;waveQuota=Math.min(14,4+wave*2);waveSpawned=0;waveBreak=0;hp=Math.min(100,hp+12);document.getElementById('hp').textContent=Math.ceil(hp);say('ВОЛНА '+wave+' · ПОДКРЕПЛЕНИЕ ПРИБЫВАЕТ')}}
if(memory>=5&&!bossSpawned&&wave>=2){bossSpawned=true;boss={x:player.x+290,y:player.y-190,hp:620,max:620,speed:34,r:25,color:'#a34348',type:'boss',hit:0,phase:1,windup:2.5,slam:0};document.getElementById('bossbar').style.display='block';say('Внимание: приближается Смотритель')}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
